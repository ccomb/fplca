# VoLCA Configuration File
#
# This is the default configuration. Databases and methods can be added
# via the web interface, CLI upload commands, or by editing this file.
#
# For local overrides, copy this file to volca.local.toml and customize it:
#   cp volca.toml volca.local.toml
#   volca --config volca.local.toml server

# Top-level scalar fields MUST come before any [section] / [[array-of-tables]]
# header. After a header, every following key is parsed as a member of that
# section until the next header. Startup warns about every key nothing reads,
# naming its path, which is how such a mistake is found.
#
# Geographies are required for regionalized LCIA cascade lookups. The other two
# widen how flows are recognised across databases and methods; both optional.
geographies = "data/geographies.csv"
# chem-synonyms = "data/chem_synonyms.csv"      # PubChem snapshot for the mapping suggester
# substance-edges = "data/substance_edges.csv"  # typed correspondences between substances

# ── Server ───────────────────────────────────────────────────────────

[server]
port = 8080                     # HTTP port
# The interface to listen on. The default answers this machine and nothing
# else, which is what leaving the password unset assumes. Use "0.0.0.0" to
# answer the network over IPv4, "::" over IPv6, or name one interface's own
# address to answer on that one alone.
host = "127.0.0.1"
# A request must carry this: Authorization: Bearer <it>, HTTP Basic, or the
# session cookie the login page sets. --password and VOLCA_PASSWORD override it.
# password = "changeme"
# How this server introduces itself over MCP, so someone holding several can
# tell which one answered.
# name = "lab-archive"

# ── Hosting limits ───────────────────────────────────────────────────
#
# For a server answering people who did not configure it. Every setting here
# is a refusal rather than data, and GET /api/v1/hosting reports all of them,
# so a client can explain a limit before a request runs into it. Absent, the
# server refuses nothing.
#
# [hosting]
# read_only = true                  # refuse every change; queries still answer
# read_only_message = "Ask the operator to load it for you."
# max_uploads = 2                   # -1 unlimited, 0 disables uploading
# max_upload_mb = 100               # per upload; -1 unlimited, 0 disables
# max_loaded_uploads = 1            # how many uploads may sit in memory at once
# api_access = true                 # false refuses programmatic access
# upgrade_upload = ""               # what to say instead of a bare refusal
# upgrade_api = ""
# upgrade_vm_size = ""

# ── Databases ────────────────────────────────────────────────────────
#
# Supported formats: EcoSpold2 (.7z/.zip of .spold), EcoSpold1 (.xml),
#                    SimaPro CSV (.csv/.csv.zip)
#
# Fields:
#   name          (required) Internal identifier (URL-safe slug)
#   path          (required) Path to database file
#   displayName              Human-readable name (defaults to name)
#   description              Short description
#   load          = false    Load at startup (transitively loads dependencies)
#   default       = false    Use as the default database
#   depends       = []       Names of databases this one depends on
#   locationAliases = {}     Location name corrections (e.g. {ENTSO = "ENTSO-E"})
#
# Example:
#
# [[databases]]
# name = "ecoinvent-3.11"
# displayName = "Ecoinvent 3.11"
# path = "DBs/ecoinvent 3.11_cutoff_ecoSpold02.7z"
# description = "Cutoff System Model"
# load = true
# default = true
#
# [[databases]]
# name = "agribalyse-3.2"
# displayName = "Agribalyse 3.2"
# path = "DBs/AGB32_final.CSV.zip"
# depends = ["ecoinvent-3.11"]
# load = true

# ── Methods ──────────────────────────────────────────────────────────
#
# LCIA characterization methods. Accepted: an ILCD directory or .zip of XML
# files, a SimaPro or columnar method .csv, or an openLCA ImpactCategory .json.
#
# Fields:
#   name           (required) Method collection name
#   path           (required) Path to method archive
#   active         = true     Enable this method
#   description               Short description
#   global-methods            Names of methods here whose factors apply
#                             everywhere, so the regionalized cascade is skipped
#   scoring                   [[methods.scoring]] blocks: single scores built
#                             from these categories
#   patches                   [[methods.patches]] blocks: corrections to
#                             individual characterization factors
#
# The last two have a page of their own: https://www.volca.run/docs/guides/single-score/
#
# Example (bring your own):
#
# [[methods]]
# name = "EF-3.1"
# path = "DBs/EF-v3.1.zip"

# "Plain indicators" — a small, license-clean method that counts raw physical
# quantities through the supply chain (land occupied, water used, fossil CO2,
# methane, primary energy, waste heat, cadmium), each an LCIA category whose
# factors are all 1.0. Rule-derived, not copied from any licensed workbook, so it
# ships with the engine and ports to any loaded database through the flow registry.
[[methods]]
name = "plain-indicators"
path = "data/methods/plain-indicators.csv"
active = true
description = "Raw physical quantities counted through the supply chain (CF=1.0)"

# ── Reference data (shipped with VoLCA) ──────────────────────────────

[[flow-synonyms]]
name = "Default flow synonyms"
path = "data/flows.csv"
active = true

[[compartment-mappings]]
name = "Default compartment mapping"
path = "data/compartments.csv"
active = true

[[units]]
name = "Default units"
path = "data/units.csv"
active = true

[[energy-densities]]
name = "Default energy densities"
path = "data/energy_density.csv"
active = true

# ── Classification Presets ───────────────────────────────────────────
#
# Named filter shortcuts that appear as options in the Activities page
# classification dropdown. Each preset applies one or more (system, value)
# filters when selected.
#
# Fields:
#   name          (required) Internal identifier (used in URLs)
#   label         (required) Display label shown in the dropdown
#   description              Optional tooltip / documentation string
#   filters                  List of { system, value, mode } classification pairs (mode: "exact" or "contains")
#                            AND across different systems, OR within same system

# Example preset for Agribalyse — uncomment to activate:
#
# [[classification-presets]]
# name = "transformed"
# label = "Transformed ingredients (at plant)"
# description = "All downstream food processing steps and agri-transformations. Matches Agricultural\\Food\\* (distribution, packaging, preparation, retail, recipes, cheese production) and *\\Transformation (animal feed, plant oils, etc.)"
# filters = [
#     { system = "Category", value = "Agricultural\\Food", mode = "exact" },
#     { system = "Category", value = "Agricultural\\Plant production\\Cereals\\Transformation", mode = "exact" },
# ]
